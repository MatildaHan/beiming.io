<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>须臾之间</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="banner-mode">

    <!-- ===== 顶部导航 ===== -->
    <header class="site-header" id="siteHeader">
        <div class="header-wrap">
            <div class="logo-area">
                <h1 class="logo-name" id="siteName">须臾之间</h1>
                <span class="logo-slogan" id="siteDesc">寄蜉蝣于天地，渺沧海之一粟</span>
            </div>
            <nav class="nav-list" id="globalNav">
                <a data-page="page-home" class="active"><span class="nav-text">序章</span></a>
                <a data-page="page-suibi"><span class="nav-text">随笔</span></a>
                <a data-page="page-zaji"><span class="nav-text">杂记</span></a>
                <a data-page="page-xianhua"><span class="nav-text">闲话</span></a>
            </nav>
        </div>
    </header>

    <main class="container" id="app">
        <!-- ===== 序章（Banner 首屏） ===== -->
        <section id="page-home" class="page-section active">
            <section class="banner" id="banner">
                <div class="banner-full" id="bannerFull"></div>
                <div class="banner-fragments" id="bannerFragments"></div>
                <div class="banner-final-image" id="bannerFinalImage"></div>
                <div class="rain-layer" id="bannerRainWrap">
                    <canvas id="bannerRainCanvas"></canvas>
                </div>

                <div class="banner-overlay" id="bannerOverlay">
                    <div class="banner-text" id="bannerText"></div>
                    <button class="banner-btn" id="bannerBtn">去告诉她 <span class="btn-arrow">›</span></button>
                </div>
            </section>

            <div class="home-content">
                <div class="gap-divider"></div>
                <div class="essay-section">
                    <div class="essay-grid" id="homeSuibi"></div>
                </div>
                <div class="gap-divider"></div>
                <div class="note-section">
                    <div class="note-left">
                        <h2 class="note-heading">杂记</h2>
                        <div class="note-desc" id="noteDesc">
                            没有宏大的主题<br>
                            也没有完整的叙事<br>
                            不足以称文章<br>
                            只用来证明<br>
                            我曾在此间停留
                        </div>
                    </div>
                    <div class="note-right" id="homeZaji"></div>
                </div>
                <!-- ★ 新增：首页底部信息 -->
                  <div class="gap-divider"></div>
        <footer class="home-footer">
            <div class="home-footer-inner">
                <div class="home-footer-left">
                    <h2 class="home-footer-name" id="footerSiteName">须臾之间</h2>
                    <p class="home-footer-desc" id="footerSiteDesc">寄蜉蝣于天地，渺沧海之一粟</p>
                </div>
                <div class="home-footer-right">
                    <div class="home-footer-row">
                        <span class="footer-icon">⏱</span>
                        <span id="footerUptime">本站已存活 0 天 0 时 0 分 0 秒</span>
                    </div>
                    <div class="home-footer-row">
                        <span class="footer-icon">↻</span>
                        <span id="footerLastUpdate">最后更新于 —</span>
                    </div>
                </div>
            </div>
        </footer>
            </div>
        </section>

        <!-- ===== 随笔 ===== -->
        <section id="page-suibi" class="page-section">
            <div class="suibi-page">
                <div class="suibi-list" id="suibiList"></div>
            </div>
        </section>

        <!-- ===== 杂记 ===== -->
        <section id="page-zaji" class="page-section">
            <div class="zaji-page">
                <div class="zaji-layout">
                    <div class="zaji-main">
                        <div class="zaji-article-list" id="zajiArticleList"></div>
                    </div>
                    <aside class="zaji-sidebar">
                        <h3 class="zaji-sidebar-title">系列</h3>
                        <div class="zaji-series-list" id="zajiSeriesList"></div>
                    </aside>
                </div>
            </div>
        </section>

        <!-- ===== 杂记 详情 ===== -->
        <section id="zaji-detail" class="page-section">
            <div class="zaji-page">
                <div class="book-main">
                    <h2 class="title" id="zajiDetailTitle"></h2>
                    <div class="date" id="zajiDetailDate"></div>
                    <div class="book-content" id="zajiDetailContent"></div>
                    <button class="back-btn" data-back="page-zaji">返回</button>
                </div>
            </div>
        </section>

        <!-- ===== 闲话 ===== -->
        <section id="page-xianhua" class="page-section">
            <div class="xianhua-page">
                <div class="about-text" id="xianhuaContent"></div>
                <hr class="about-divider">
                <div class="about-links">
                    <p class="links-title">若能得您垂青，还望链接小站：</p>
                    <div class="site-info">
                        <div class="site-info-item">
                            <span class="site-info-label">名称</span>
                            <span class="site-info-value">须臾之间</span>
                        </div>
                        <div class="site-info-item">
                            <span class="site-info-label">描述</span>
                            <span class="site-info-value">寄蜉蝣于天地，渺沧海之一粟。</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
